plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.91'
}

version = '1.0.0'
group = 'io.github.hellfraud.scaletooltips'

base {
    archivesName = 'scale-tooltips-neoforge-1.21.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

neoForge {
    version = '21.1.176'

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        scaletooltips {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

jar {
    from('../LICENSE')
}

repositories.withType(MavenArtifactRepository).configureEach { repo ->
    if (repo.url.toString().contains('maven.neoforged.net')) {
        repo.url = uri(repo.url.toString().replace('maven.neoforged.net', '1755624453.rsc.cdn77.org'))
    }
}
